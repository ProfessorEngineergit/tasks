<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html {
            height: 100%;
            overscroll-behavior: none;
            overscroll-behavior-y: none;
        }
        
        body {
            font-family: 'Exo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: #ffffff;
            overscroll-behavior: none;
            overscroll-behavior-y: none;
        }
        
        .container {
            background: #000000;
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
            margin-top: 40px;
        }
        
        #login-container {
            text-align: center;
            padding: 60px 40px;
        }
        
        #login-container h1 {
            color: #00ff88;
            margin-bottom: 40px;
            font-size: 3em;
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        #login-btn {
            background: #00ff88;
            color: #000000;
            border: none;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.3);
        }
        
        #login-btn:hover {
            background: #00dd77;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 255, 136, 0.4);
        }
        
        #login-btn:active {
            transform: translateY(0);
        }
        
        #app {
            display: none;
        }
        
        #app.active {
            display: block;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1a1a1a;
        }
        
        .welcome {
            font-size: 24px;
            font-weight: 700;
            color: #00ff88;
        }
        
        #logout-btn {
            background: transparent;
            color: #ff4444;
            border: 2px solid #ff4444;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        #logout-btn:hover {
            background: #ff4444;
            color: #000000;
        }
        
        .task-form {
            background: #0a0a0a;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            border: 2px solid #1a1a1a;
            overflow: hidden;
        }
        
        .task-form h2 {
            margin-bottom: 24px;
            color: #00ff88;
            font-weight: 800;
            font-size: 22px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #00ff88;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #1a1a1a;
            background: #000000;
            color: #ffffff;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Exo 2', sans-serif;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        
        #add-task-btn {
            background: #00ff88;
            color: #000000;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.3);
        }
        
        #add-task-btn:hover {
            background: #00dd77;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 255, 136, 0.4);
        }
        
        #add-task-btn:active {
            transform: translateY(0);
        }
        
        .tasks-list h2 {
            margin-bottom: 24px;
            color: #00ff88;
            font-weight: 800;
            font-size: 22px;
        }
        
        .task-card {
            background: #0a0a0a;
            border: 2px solid #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            -webkit-touch-callout: none;
            user-select: none;
        }
        
        .task-card:hover {
            transform: translateY(-4px);
            border-color: #00ff88;
            box-shadow: 0 12px 32px rgba(0, 255, 136, 0.2);
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .task-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            flex: 1;
            line-height: 1.3;
        }
        
        .task-due-badge {
            background: #1a1a1a;
            color: #00ff88;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 12px;
        }
        
        .task-due-badge.overdue {
            background: #ff4444;
            color: #000000;
        }
        
        .task-due-badge.today {
            background: #00ff88;
            color: #000000;
        }
        
        .progress-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .progress-box {
            flex: 1;
            height: 60px;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            position: relative;
        }
        
        .progress-box:hover {
            border-color: #00ff88;
            transform: scale(1.05);
        }
        
        .progress-box.filled {
            background: #00ff88;
            border-color: #00ff88;
            color: #000000;
            box-shadow: 0 4px 16px rgba(0, 255, 136, 0.4);
        }
        
        .progress-box.filled::after {
            content: '✓';
            font-size: 28px;
            font-weight: 800;
        }
        
        .progress-text {
            margin-bottom: 16px;
            color: #888888;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        
        .progress-text.complete {
            color: #00ff88;
        }
        
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #1a1a1a;
        }
        
        .task-footer-left {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .task-repeat-badge {
            background: #1a1a1a;
            color: #888888;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .postpone-btn {
            background: #00ff88;
            color: #000000;
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .postpone-btn:hover {
            background: #00dd77;
            transform: scale(1.05);
        }
        
        .postpone-btn:active {
            transform: scale(0.95);
        }
        
        .date-separator {
            height: 2px;
            background: linear-gradient(to right, transparent, #00ff88, transparent);
            margin: 32px 0;
            position: relative;
        }
        
        .date-separator.long-term {
            background: linear-gradient(to right, transparent, #00ff88, transparent);
            height: 3px;
            margin: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .date-separator.long-term span {
            background: #000000;
            color: #00ff88;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            border: 2px solid #00ff88;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .delete-btn {
            background: #ff4444;
            color: #000000;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        
        .delete-btn.visible {
            opacity: 1;
            pointer-events: all;
        }
        
        .delete-btn:hover {
            background: #ee3333;
            transform: scale(1.05);
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #555555;
        }
        
        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.2;
        }
        
        .empty-state p {
            font-size: 18px;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #00ff88;
            font-weight: 600;
        }

        /* Animations */
        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .progress-box.just-filled {
            animation: pop 0.4s ease;
        }

        /* Color input styling for date picker */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        /* Mobile: prevent date input from overflowing the form card */
        @media (max-width: 640px) {
            input[type="date"] {
                -webkit-appearance: none;
                appearance: none;
                min-width: 0;
                max-width: 100%;
            }
        }

        /* Material Symbols baseline alignment */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            line-height: 1;
            font-size: 18px;
        }

        .ms-green {
            color: #00ff88;
        }

        /* ── Drag & Drop ──────────────────────────── */
        .task-card[draggable="true"] {
            cursor: default;
        }

        .task-card[draggable="true"]:active {
            cursor: grabbing;
        }

        .task-card.dragging {
            opacity: 0.35;
            transform: rotate(2deg) scale(0.97);
            cursor: grabbing;
            pointer-events: none;
        }

        .drag-placeholder {
            background: linear-gradient(90deg, transparent, rgba(0,255,136,0.08), transparent);
            border: 2px dashed rgba(0,255,136,0.45);
            border-radius: 20px;
            margin-bottom: 16px;
            animation: placeholder-pulse 1.1s ease-in-out infinite;
        }

        @keyframes placeholder-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes just-dropped-kf {
            0%   { transform: scale(1.03); box-shadow: 0 0 40px rgba(0,255,136,0.55); }
            60%  { transform: scale(0.99); }
            100% { transform: scale(1);    box-shadow: none; }
        }

        .task-card.just-dropped {
            animation: just-dropped-kf 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ── Re-sort button ──────────────────────── */
        .resort-btn {
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Exo 2', sans-serif;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .resort-btn:hover {
            background: rgba(0,255,136,0.12);
        }

        .resort-btn:active {
            transform: scale(0.97);
        }

        /* ── Completion Modal ────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #0a0a0a;
            border: 2px solid #00ff88;
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            animation: modal-appear 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modal-appear {
            0%   { transform: scale(0.65); opacity: 0; }
            100% { transform: scale(1);    opacity: 1; }
        }

        .modal-icon {
            margin-bottom: 16px;
        }

        .modal-icon .material-symbols-outlined {
            font-size: 64px;
            color: #00ff88;
        }

        .modal-content h2 {
            color: #00ff88;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-content p {
            color: #888888;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .modal-buttons {
            display: flex;
            gap: 16px;
        }

        .modal-done-btn {
            background: #00ff88;
            color: #000000;
            border: none;
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Exo 2', sans-serif;
            flex: 1;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0,255,136,0.3);
            touch-action: manipulation;
        }

        .modal-done-btn:hover {
            background: #00dd77;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0,255,136,0.5);
        }

        .modal-done-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .modal-delete-btn {
            background: transparent;
            color: #ff4444;
            border: 2px solid #ff4444;
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Exo 2', sans-serif;
            flex: 1;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .modal-delete-btn:hover {
            background: #ff4444;
            color: #000000;
        }

        .modal-delete-btn:active {
            transform: scale(0.97);
        }

        /* ── GitHub Footer ───────────────────────── */
        .app-footer {
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid #1a1a1a;
            text-align: center;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #444444;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .github-link:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Container -->
        <div id="login-container">
            <h1>✓ Tasks</h1>
            <button id="login-btn">
                <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                Mit GitHub anmelden
            </button>
        </div>

        <!-- App Container (hidden until logged in) -->
        <div id="app">
            <div class="header">
                <div class="welcome">
                    Hallo, <span id="user-name">User</span>! <span class="material-symbols-outlined ms-green" style="font-size:22px;vertical-align:-3px;">waving_hand</span>
                </div>
                <button id="logout-btn">Logout</button>
            </div>

            <!-- Task Form -->
            <div class="task-form">
                <h2>Neue Aufgabe</h2>
                <div class="form-group">
                    <label for="task-title">Titel</label>
                    <input type="text" id="task-title" placeholder="Was möchtest du erledigen?">
                </div>
                <div class="form-group">
                    <label for="task-due">Fälligkeitsdatum</label>
                    <input type="date" id="task-due">
                </div>
                <div class="form-group">
                    <label for="task-repeat">Wiederholung</label>
                    <select id="task-repeat">
                        <option value="none">Keine</option>
                        <option value="daily">Täglich</option>
                        <option value="every2days">Alle 2 Tage</option>
                        <option value="every3days">Alle 3 Tage</option>
                        <option value="weekly">Wöchentlich</option>
                        <option value="monthly">Monatlich</option>
                    </select>
                </div>
                <button id="add-task-btn">Aufgabe hinzufügen</button>
            </div>

            <!-- Tasks List -->
            <div class="tasks-list">
                <h2>Meine Aufgaben</h2>
                <div id="tasks-container">
                    <div class="loading">Lade Aufgaben...</div>
                </div>
            </div>
        </div>

        <!-- GitHub Footer – inside container so it stays in the centered column -->
        <footer class="app-footer">
            <a href="https://github.com/ProfessorEngineergit/tasks" target="_blank" rel="noopener noreferrer" class="github-link">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                Link zum Repo
            </a>
        </footer>
    </div>

    <!-- Completion Modal – fixed overlay, lives outside the scroll container -->
    <div id="completion-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">
                <span class="material-symbols-outlined">task_alt</span>
            </div>
            <h2>Aufgabe abgeschlossen!</h2>
            <p>Was möchtest du tun?</p>
            <div class="modal-buttons">
                <button id="modal-done-btn" class="modal-done-btn">
                    <span class="material-symbols-outlined">celebration</span>
                    Fertig!
                </button>
                <button id="modal-delete-btn" class="modal-delete-btn">
                    <span class="material-symbols-outlined">delete</span>
                    Löschen
                </button>
            </div>
        </div>
    </div>

    <!-- canvas-confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- Firebase v9 SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
